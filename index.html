<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brief Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/* Layout: header (headline, filter + progress), then two tabs: Tickets (new task, four status lanes) and History (one Monday–Sunday week at a time, from the week files). A task opens in a dialog with its story, history and actions. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #172033; --muted: #5b6577; --line: #dde2ea;
  --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --crit: #c2362f; --crit-soft: #fbe9e7; --warn: #a96a06; --warn-soft: #fbf1df; --ok: #23824f; --ok-soft: #e3f3ea;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
/* Themes: light (above), dark and cobalt are picked in the header (data-theme on <html>); with none picked, dark follows the system. */
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #0f1420; --surface: #171e2d; --ink: #e5e9f1; --muted: #98a2b5; --line: #273145;
  --accent: #7d9cf0; --accent-soft: #1f2a46;
  --crit: #f0827a; --crit-soft: #3a1f22; --warn: #e2b05a; --warn-soft: #362b17; --ok: #6cc795; --ok-soft: #173126;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #171e2d; --ink: #e5e9f1; --muted: #98a2b5; --line: #273145;
  --accent: #7d9cf0; --accent-soft: #1f2a46;
  --crit: #f0827a; --crit-soft: #3a1f22; --warn: #e2b05a; --warn-soft: #362b17; --ok: #6cc795; --ok-soft: #173126;
  color-scheme: dark; }
:root[data-theme="cobalt"] {
  --bg: #122738; --surface: #193549; --ink: #ffffff; --muted: #9fb6c9; --line: #26506f;
  --accent: #ffc600; --accent-soft: #1d425e;
  --crit: #ff628c; --crit-soft: #3d2639; --warn: #ff9d00; --warn-soft: #3a3324; --ok: #3ad900; --ok-soft: #1b3d2e;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 0.875rem/1.5 var(--body); }
/* Full width: extra screen goes to the lanes, not to bigger type. */
.wrap { padding-block: max(1.5rem, env(safe-area-inset-top, 0rem)) 3rem;
  padding-left: max(clamp(1rem, 2vw, 2rem), env(safe-area-inset-left, 0rem)); padding-right: max(clamp(1rem, 2vw, 2rem), env(safe-area-inset-right, 0rem));
  display: grid; gap: 1.25rem; }
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--line); }
.tab { all: unset; cursor: pointer; font: 600 0.875rem var(--body); color: var(--muted); padding: 0.5rem 0.875rem; border-bottom: 0.125rem solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 0.125rem solid var(--accent); outline-offset: -0.125rem; }
.tab .count { font: 500 0.75rem var(--mono); color: var(--muted); margin-left: 0.25rem; }
.weeknav { display: flex; gap: 0.75rem; align-items: center; }
.weeknav b { font: 600 0.875rem var(--mono); font-variant-numeric: tabular-nums; }
ol.tl li.day { display: block; font: 600 0.75rem var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 0.625rem; border-top: 1px solid var(--line); }
header { display: grid; gap: 0.875rem; grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
@media (max-width: 720px) { header { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { font: 500 0.75rem var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
h1 { font: 700 1.75rem/1.15 var(--display); margin: 0.125rem 0 0.375rem; text-wrap: balance; }
.headline { color: var(--muted); margin: 0; font-size: 1.125rem; }
.note { font: 0.75rem var(--mono); color: var(--warn); }

.side { display: grid; gap: 0.375rem; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; padding: 0.875rem 1rem; display: grid; gap: 0.625rem; min-width: 17.5rem; }
@media (max-width: 720px) { .progress { min-width: 0; } }
.progress .num { font: 700 1.625rem var(--display); font-variant-numeric: tabular-nums; }
.progress .num small { font: 500 0.8125rem var(--body); color: var(--muted); }
.bar { height: 0.5rem; background: var(--line); border-radius: 6.1875rem; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s ease; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.375rem; height: 2.875rem; }
.week div { display: grid; gap: 0.1875rem; justify-items: center; align-content: end; }
.week i { display: block; width: 100%; background: var(--accent); border-radius: 0.1875rem 0.1875rem 0 0; min-height: 0.125rem; }
.week i.today { background: var(--ok); }
.week b { font: 400 0.625rem var(--mono); color: var(--muted); }

.lanes { display: grid; gap: 0.875rem; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1000px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
.lane { display: grid; gap: 0.5rem; min-width: 0; }
.lane h2 { font: 600 0.8125rem var(--body); margin: 0; display: flex; gap: 0.5rem; align-items: baseline; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.lane h2 .count { font: 500 0.75rem var(--mono); color: var(--ink); }
.empty { color: var(--muted); font-size: 0.8125rem; padding: 0.625rem 0.125rem; border-top: 1px dashed var(--line); }

.card { all: unset; box-sizing: border-box; -webkit-user-drag: element; /* all: unset clears it, and Chromium then never starts a drag */ cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.625rem 0.75rem; display: grid; gap: 0.375rem; min-width: 0; }
.card:hover { border-color: var(--accent); }
.lanes { align-items: stretch; } .lane { align-content: start; border-radius: 0.5rem; }
.lane.drop { outline: 0.125rem dashed var(--accent); outline-offset: 0.25rem; }
.card:focus-visible { outline: 0.125rem solid var(--accent); outline-offset: 0.125rem; }
.card.urgent { border-left: 0.1875rem solid var(--crit); }
.card.closed .title { color: var(--muted); }
.card.dropped .title { text-decoration: line-through; }
.title { font-weight: 500; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; font: 0.75rem var(--mono); color: var(--muted); }
.pill { font: 500 0.6875rem var(--mono); padding: 1px 0.4375rem; border-radius: 6.1875rem; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.run { background: var(--warn-soft); color: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
.pill.tag { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.untag { all: unset; cursor: pointer; margin-left: 0.25rem; }
.untag:focus-visible, .link:focus-visible { outline: 0.125rem solid var(--accent); }
.tagrow { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }
/* The filter: a dropdown of checkbox groups; what's unchecked is hidden. Each row's "only" shows on hover or focus. */
.filter { position: relative; display: inline-block; margin-top: 0.625rem; }
#theme { margin-top: 0.625rem; margin-left: 0.25rem; }
.filter summary { list-style: none; }
.filter summary::-webkit-details-marker { display: none; }
.filter summary::after { content: " ▾"; color: var(--muted); }
.filter .menu { position: absolute; z-index: 10; top: calc(100% + 0.25rem); left: 0; min-width: 16rem; max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.75rem; display: grid; gap: 0.875rem; box-shadow: 0 0.5rem 1.5rem rgb(10 14 24 / .2); }
.filter fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 0.25rem; }
.filter legend { display: flex; gap: 0.625rem; align-items: baseline; width: 100%; padding: 0 0 0.25rem; font: 600 0.75rem var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.filter legend span { flex: 1; }
.filter .opt { display: flex; gap: 0.5rem; align-items: center; }
.filter .opt .link { opacity: 0; }
.filter .opt:hover .link, .filter .opt .link:focus-visible { opacity: 1; }
.filter label { flex: 1; display: flex; gap: 0.5rem; align-items: center; font: 0.875rem var(--body); color: var(--ink); cursor: pointer; }
.link { all: unset; cursor: pointer; color: var(--accent); font: 500 0.75rem var(--body); }
@keyframes pulse { 50% { opacity: .55; } }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code.ref { font: 500 0.75rem var(--mono); }
code { font: 0.9em var(--mono); }

section.log { background: var(--surface); border: 1px solid var(--line); border-radius: 0.625rem; padding: 0.875rem 1rem; display: grid; gap: 0.5rem; }
section.log h2, dialog h3 { font: 700 1rem var(--display); margin: 0; }
ol.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.5rem; }
ol.tl li { display: grid; grid-template-columns: 3.25rem minmax(0, 1fr); gap: 0.625rem; }
ol.tl time { font: 0.75rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
ol.tl .who { font: 500 0.6875rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
ol.tl .txt { white-space: pre-wrap; overflow-wrap: anywhere; }

dialog { width: min(47.5rem, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(10 14 24 / .45); }
.dlg { display: grid; gap: 1rem; padding: 1.125rem 1.25rem 1.25rem; }
.dlg-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: start; }
.dlg-head h2 { font: 700 1.25rem/1.25 var(--display); margin: 0 0 0.375rem; text-wrap: balance; overflow-wrap: anywhere; }
.x { all: unset; cursor: pointer; font: 1.25rem var(--mono); color: var(--muted); padding: 0 0.375rem; border-radius: 0.375rem; }
.x:focus-visible { outline: 0.125rem solid var(--accent); }
.story { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 72ch; }
.refs { display: flex; flex-wrap: wrap; gap: 0.5rem 0.875rem; font-size: 0.8125rem; }
.actions { border-top: 1px solid var(--line); padding-top: 0.875rem; display: grid; gap: 0.625rem; }
label { font: 500 0.75rem var(--body); color: var(--muted); display: grid; gap: 0.25rem; }
textarea, input[type=text] { font: 0.875rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.5rem 0.625rem; width: 100%; }
textarea { min-height: 4.5rem; resize: vertical; }
textarea:focus, input:focus { outline: 0.125rem solid var(--accent); outline-offset: 0; border-color: transparent; }
.btns { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.btn { font: 600 0.8125rem var(--body); border-radius: 0.5rem; padding: 0.5rem 0.875rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible { outline: 0.125rem solid var(--accent); outline-offset: 0.125rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.hint { font-size: 0.75rem; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }
select { font: 0.875rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.5rem 0.625rem; }
.err { font-size: 0.8125rem; color: var(--crit); }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } .pill.run { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Brief Board</h1>
      <p class="headline" id="headline">Tasks from the daily brief appear here once Claude writes them.</p>
      <div class="note" id="note" hidden></div>
      <details class="filter" id="filter"><summary class="btn" id="filter-sum">Show: all</summary><div class="menu" id="filter-menu"></div></details>
      <select id="theme" aria-label="Theme"><option value="">Theme: system</option><option value="light">Light</option><option value="dark">Dark</option><option value="cobalt">Cobalt</option></select>
    </div>
    <div class="side">
      <div class="progress" aria-label="Last brief">
        <div class="eyebrow">Last brief</div>
        <div class="num" id="date">None yet</div>
        <div class="hint" id="brun" hidden></div>
        <button class="btn" id="run-brief">Run brief now</button>
      </div>
      <div class="progress" aria-label="Today's progress">
        <div class="num" id="pnum">0 / 0 <small>closed today</small></div>
        <div class="bar"><span id="pbar"></span></div>
        <div class="week" id="week" aria-label="Tasks closed per day, last 7 days"></div>
      </div>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-tickets" aria-controls="lanes">Tickets <span class="count" id="n-tickets"></span></button>
    <button class="tab" role="tab" id="tab-history" aria-controls="log">History <span class="count" id="n-history"></span></button>
  </div>
  <div class="toolbar" id="toolbar">
    <button class="btn" id="new-task">+ New task</button>
  </div>
  <div class="lanes" id="lanes" role="tabpanel" aria-labelledby="tab-tickets"></div>
  <section class="log" id="log" role="tabpanel" aria-labelledby="tab-history">
    <div class="weeknav"><button class="btn" id="wk-prev">‹ Earlier week</button><b id="wk-label"></b><button class="btn" id="wk-next">Later week ›</button></div>
    <ol class="tl" id="activity"></ol>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>

<script>
const LANES = [["todo", "To do"], ["doing", "In progress"], ["waiting", "Waiting on others"], ["closed", "Closed today"]];
const GROUP = { waiting_on_you: ["Owed reply", "warn"], ready: ["Ready to close", "ok"],
  waiting_on_others: ["Waiting", ""], roadmap: ["Roadmap", ""], later: ["Later", ""] };
// Urgency and importance are Eugene's, three levels each; every task has both, medium unless set.
const LEVEL = [["high", "High"], ["medium", "Medium"], ["low", "Low"]];
const STATUS = [["todo", "To do"], ["doing", "In progress"], ["waiting", "Waiting"], ["done", "Done"], ["dropped", "Dropped"]];
// A task's source is who maintains it; "" is the brief.
const SOURCE = { "": "Brief", eugene: "Eugene", sweep: "Sweep" };
const $ = (id) => document.getElementById(id);
const ymd = (d) => { const z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const hm = (s) => new Date(s).toTimeString().slice(0, 5);
// Dates read day.month (30.11). Accepts a Date, an ISO timestamp or YYYY-MM-DD.
const dm = (s) => { const d = typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T12:00") : new Date(s); return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`; };
const PRE_QA = new Set(["Backlog", "Selected for Development", "ToDo", "To Do", "In Progress", "Dev Done"]);
// A kith: link opens kith at that room, and at the message when there is one.
const kithURI = (room, event) => "kith:" + encodeURIComponent(room) + (event ? "?event=" + encodeURIComponent(event) : "");
const kithLink = (label, room, event) => `<a href="${esc(kithURI(room, event))}">${esc(label)} ↗</a>`;
// A message opens at its url (kith-mcp's link: the network's own, like matrix.to) when it is https, else in kith.
const messageLink = (m) => /^https:\/\//.test(m.url || "") ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label || "message")} ↗</a>` : kithLink(m.label || "message", m.room, m.event);
const preQa = (t) => t.status === "done" ? (t.jira || []).filter((k) => PRE_QA.has((t.jiraStatus || {})[k])) : [];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Issue and PR link bases come from the server (BOARD_ISSUE_URL, BOARD_PR_URL); no link when unset.
const cfg = () => state.config || {};
const refs = (s) => esc(s)
  .replace(/\b([A-Z][A-Z0-9]+-\d+)\b/g, (m) => cfg().issue ? `<a href="${cfg().issue}${m}" target="_blank" rel="noopener"><code class="ref">${m}</code></a>` : `<code class="ref">${m}</code>`)
  .replace(/(^|[\s(*])#(\d{3,5})\b/g, (m, pre, n) => cfg().pr ? `${pre}<a href="${cfg().pr}${n}" target="_blank" rel="noopener"><code class="ref">#${n}</code></a>` : m)
  .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
// The markdown the brief writes: `code` and [text](url) are cut out before refs links keys and URLs, **bold** last.
const linkify = (s) => String(s ?? "").split(/(`[^`\n]+`|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))/)
  .map((p, i) => i % 2 === 0 ? refs(p) : p[0] === "`" ? `<code>${esc(p.slice(1, -1))}</code>`
    : p.replace(/^\[(.+)\]\((.+)\)$/, (m, t, u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`))
  .join("").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
let state = { brief: {}, tasks: [] }, pend = [], openId = null, today = ymd(new Date()), poll;
// Set a node's markup only when it changed, so a data update leaves untouched nodes (focus, selection, a drag in progress) alone.
const put = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };

const closed = (t) => t.status === "done" || t.status === "dropped";
const running = (t) => t.job && t.job.status === "running";
function laneOf(t) {
  if (closed(t)) return t.doneAt && ymd(new Date(t.doneAt)) === today ? "closed" : null;
  return t.status === "doing" || t.status === "waiting" ? t.status : "todo";
}
// Areas come from the server (BOARD_AREAS); work holds anything unmarked.
const areaList = () => (cfg().areas || []).map((a) => [a.id, a.name]);
const areaName = (id) => (areaList().find(([v]) => v === id) || [id, id])[1];
const allTags = () => [...new Set(state.tasks.flatMap((t) => t.tags || []))].sort();
// Every value of a task field in use, sorted; "" is a task without one.
const allOf = (f) => [...new Set(state.tasks.map((t) => t[f] || ""))].sort();
// The filter narrows the lanes, the progress summary and History by each task field below and tag. It keeps
// what's unchecked, so a new project, person or tag shows up by default; "" is a task with no group, source, person or tag.
let hide = { area: [], status: [], group: [], urgency: [], importance: [], who: [], waitingFor: [], source: [], tag: [] };
try { hide = { ...hide, ...JSON.parse(localStorage.getItem("hide")) }; } catch {}
const filterOpts = () => [["area", "Area", areaList()], ["status", "Status", STATUS],
  ["group", "Group", [...Object.entries(GROUP).map(([k, [l]]) => [k, l]), ["", "No group"]]],
  ["urgency", "Urgency", LEVEL], ["importance", "Importance", LEVEL],
  ["who", "Who", allOf("who").map((v) => [v, v || "Nobody"])],
  ["waitingFor", "Waiting for", allOf("waitingFor").map((v) => [v, v || "Nothing owed"])],
  ["source", "Source", allOf("source").map((v) => [v, SOURCE[v] || v])],
  ["tag", "Tags", [...allTags().map((g) => [g, "#" + g]), ["", "No tag"]]]];
const filtering = () => Object.values(hide).some((v) => v.length);
// Each filter dim is the task field of that name; a tagged task shows while any of its tags is checked.
const visible = (t) => Object.entries(hide).every(([dim, off]) => dim === "tag"
  ? ((t.tags || []).length ? t.tags.some((g) => !off.includes(g)) : !off.includes(""))
  : !off.includes(t[dim] || ""));
const carried = (t) => t.since ? Math.round((new Date(today) - new Date(t.since)) / 864e5) : 0;

function pills(t) {
  const [gl, gc] = GROUP[t.group] || [t.group || "", ""], out = [];
  if (t.area && t.area !== "work") out.push(`<span class="pill">${esc(areaName(t.area))}</span>`);
  for (const g of t.tags || []) out.push(`<span class="pill tag">#${esc(g)}</span>`);
  if (gl) out.push(`<span class="pill ${gc}">${esc(gl)}</span>`);
  if (t.urgency && t.urgency !== "medium") out.push(`<span class="pill ${t.urgency === "high" ? "crit" : ""}">urgency ${esc(t.urgency)}</span>`);
  if (t.importance && t.importance !== "medium") out.push(`<span class="pill ${t.importance === "high" ? "warn" : ""}">importance ${esc(t.importance)}</span>`);
  if (running(t)) out.push(`<span class="pill run">Claude: ${esc(t.job.action)}…</span>`);
  else if (t.job && t.job.status === "failed") out.push(`<span class="pill crit">${esc(t.job.action)} failed</span>`);
  if (preQa(t).length) out.push(`<span class="pill warn">Jira not in QA</span>`);
  if (closed(t)) out.push(`<span class="pill ${t.status === "done" ? "ok" : ""}">${t.status}${t.doneAt ? " " + hm(t.doneAt) : ""}</span>`);
  else if (carried(t) > 0) out.push(`<span class="pill ${carried(t) >= 3 ? "crit" : ""}">carried ${carried(t)}d</span>`);
  if (t.who || t.waitingFor) out.push(`<span>${esc([t.who, t.waitingFor].filter(Boolean).join(": "))}</span>`);
  return out.join("");
}

function render() {
  const opts = filterOpts();
  // A hidden value that no longer exists (a removed project, a tag nobody has) is forgotten.
  for (const [dim, , vals] of opts) hide[dim] = hide[dim].filter((v) => vals.some(([x]) => x === v));
  const by = { todo: [], doing: [], waiting: [], closed: [] };
  for (const t of state.tasks.filter(visible)) { const l = laneOf(t); if (l) by[l].push(t); }
  // The checkboxes are set after the markup, so a click doesn't rebuild the menu and lose focus.
  put($("filter-menu"), opts.map(([dim, label, vals]) => `<fieldset><legend><span>${label}</span><button type="button" class="link" data-dim="${dim}" data-to="all">All</button></legend>${
    vals.map(([v, l]) => `<div class="opt"><label><input type="checkbox" data-dim="${dim}" value="${esc(v)}">${esc(l)}</label><button type="button" class="link" data-dim="${dim}" data-to="only" data-v="${esc(v)}" aria-label="Only ${esc(l)}">only</button></div>`).join("")}</fieldset>`).join(""));
  for (const c of $("filter-menu").querySelectorAll("input")) c.checked = !hide[c.dataset.dim].includes(c.value);
  put($("filter-sum"), "Show: " + esc(opts.map(([dim, label, vals]) => {
    const on = vals.filter(([v]) => !hide[dim].includes(v));
    return on.length === vals.length ? "" : on.length === 1 ? on[0][1] : `${label} ${on.length} of ${vals.length}`;
  }).filter(Boolean).join(" · ") || "all"));
  for (const k in by) by[k].sort((a, b) => k === "closed" ? String(b.doneAt).localeCompare(String(a.doneAt))
    : (a.urgency === "high" ? 0 : 1) - (b.urgency === "high" ? 0 : 1) || (a.order ?? 99) - (b.order ?? 99));
  put($("lanes"), LANES.map(([k, label]) => `<section class="lane" data-lane="${k}"><h2>${label} <span class="count">${by[k].length}</span></h2>${
    // A div, not a <button>: Firefox won't drag buttons.
    by[k].map((t) => `<div class="card ${t.urgency === "high" && !closed(t) ? "urgent" : ""} ${closed(t) ? "closed" : ""} ${t.status === "dropped" ? "dropped" : ""}" role="button" tabindex="0" draggable="true" data-id="${esc(t.id)}"><span class="title">${esc(t.title)}</span><span class="meta">${pills(t)}</span></div>`).join("")
    || `<div class="empty">${k === "closed" ? "Nothing closed yet today." : "Empty."}</div>`}</section>`).join(""));

  const total = by.todo.length + by.doing.length + by.waiting.length + by.closed.length;
  put($("pnum"), `${by.closed.length} / ${total} <small>closed today</small>`);
  $("pbar").style.width = total ? `${(100 * by.closed.length) / total}%` : "0";
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return ymd(d); });
  const counts = days.map((d) => state.tasks.filter(visible).filter((t) => t.doneAt && ymd(new Date(t.doneAt)) === d).length), max = Math.max(1, ...counts);
  put($("week"), days.map((d, i) => `<div title="${dm(d)}: ${counts[i]} closed"><i class="${d === today ? "today" : ""}" style="height:${(1.875 * counts[i]) / max}rem"></i><b>${["Su","Mo","Tu","We","Th","Fr","Sa"][new Date(d + "T12:00").getDay()]}</b></div>`).join(""));

  $("n-tickets").textContent = total - by.closed.length;
  $("n-history").textContent = [...state.tasks.filter(visible).flatMap((t) => t.history || []), ...(filtering() ? [] : state.log || [])].filter((e) => ymd(new Date(e.at)) === today).length || "";

  const b = state.brief || {};
  if (b.headline) put($("headline"), linkify(b.headline));
  const run = state.briefRun;
  $("date").textContent = b.at ? `${dm(b.at)} ${hm(b.at)}` : "None yet";
  // The scheduled run only shows while it runs or after it failed; a good run already shows as the brief above.
  $("brun").hidden = !run || run.status === "ok";
  $("brun").textContent = !run ? "" : run.status === "running" ? `Running since ${hm(run.startedAt)}…` : `Scheduled run ${run.status} ${dm(run.startedAt)} ${hm(run.startedAt)}`;
  $("run-brief").disabled = run?.status === "running";
  if (openId) renderDialog(false);
}

  put($("dlg-title"), esc(t.title));

  put($("d-story"), `${t.summary ? `<div class="story">${linkify(t.summary)}</div>` : `<div class="hint">No story recorded yet. Clarify can fill it in.</div>`}
    ${refs.length ? `<div class="refs">${refs.join("")}</div>` : ""}`);
  if (document.activeElement !== $("f-area")) $("f-area").value = t.area;
  if (document.activeElement !== $("f-urgency")) $("f-urgency").value = t.urgency || "";
  if (document.activeElement !== $("f-importance")) $("f-importance").value = t.importance || "";
  put($("d-tags"), (t.tags || []).map((g) => `<span class="pill tag">#${esc(g)}<button type="button" class="untag" data-untag="${esc(g)}" aria-label="Remove tag ${esc(g)}">×</button></span>`).join(""));
  // Suggest every tag in use that this task doesn't have yet.
  put($("tag-list"), allTags().filter((g) => !(t.tags || []).includes(g)).map((g) => `<option value="${esc(g)}">`).join(""));
  put($("d-hist"), (t.history || []).slice().reverse().map((e) =>
    `<li><time title="${esc(e.at)}">${ymd(new Date(e.at)) === today ? hm(e.at) : dm(e.at) + " " + hm(e.at)}</time><span><span class="who">${esc(e.actor)} · ${esc(e.kind)}</span><br><span class="txt">${linkify(e.text)}</span></span></li>`).join("")
    || `<li><time>—</time><span class="hint">Nothing yet.</span></li>`);

  put($("d-btns"), `

const areaOpts = (sel) => areaList()

// New task: an id from the title, the area preset from the filter when it shows one area, Eugene as its creator.

  pend = [];

async function addTask(e) {
  e.preventDefault();
  const title = $("n-title").value.trim(); if (!title) return;
  const id = "m-" + (title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "task") + "-" + Date.now().toString(36);
  const body = { title, area: $("n-area").value, summary: $("n-summary").value.trim(), status: "todo", since: today, source: "eugene",
    urgency: $("n-urgency").value, importance: $("n-importance").value, tags: [...new Set($("n-tags").value.split(",").map(tagOf).filter(Boolean))] };
  const r = await fetch(`api/tasks/${id}?actor=eugene`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => null);
  if (!r || !r.ok) { $("f-err").hidden = false; $("f-err").textContent = (r && (await r.json().catch(() => ({}))).error) || "Couldn't add the task."; return; }
  const failed = await attach(id);
  await apply(r);
  openId = id; renderDialog(true);
  if (failed) { $("f-err").hidden = false; $("f-err").textContent = "Added the task. " + failed; }
}

// Files wait in pend, shown as removable chips, until attach uploads them to the task; it returns why that failed, or "".
const filesField = (what) => `<div class="tagrow"><button type="button" class="btn" id="f-pick" title="${what}">📎 Attach files</button>
  <span id="f-list" style="display:contents"></span><input type="file" id="f-files" multiple hidden></div>`;
const showFiles = () => put($("f-list"), pend.map((f, i) => `<span class="pill tag">${esc(f.name)}<button type="button" class="untag" data-unfile="${i}" aria-label="Remove ${esc(f.name)}">×</button></span>`).join(""));
async function attach(id) {
  if (!pend.length) return "";
  const fd = new FormData();
  for (const f of pend) fd.append("file", f);
  const r = await fetch(`api/tasks/${encodeURIComponent(id)}/files`, { method: "POST", body: fd }).catch(() => null);
  return r && r.ok ? "" : (r && (await r.json().catch(() => ({}))).error) || "Couldn't attach the files.";
}

async function refresh() {
  try {
    const r = await fetch("api/state");
    if (!r.ok) throw new Error(r.status);
    state = await r.json(); today = ymd(new Date());
    $("note").hidden = true; render();
    if (!$("log").hidden) loadLog();
  } catch (e) { $("note").hidden = false; $("note").textContent = "Can't reach the board server; what's shown may be out of date."; }
  clearTimeout(poll); poll = setTimeout(refresh, state.tasks.some(running) ? 3000 : 15 * 60000);
}

// Apply the task a write returned to the local data; the poll picks up everything else.
async function apply(r) {
  const t = await r.json(), i = state.tasks.findIndex((x) => x.id === t.id);
  if (i < 0) state.tasks.push(t); else state.tasks[i] = t;
  render(); return t;
}

async function act(action, key) {
  const comment = $("f-comment").value.trim(), err = $("f-err");
  if (action === "clarify" && !comment) { err.hidden = false; err.textContent = "Say what to clarify."; return; }
  err.hidden = true;
  const failed = await attach(openId);
  if (failed) { err.hidden = false; err.textContent = failed; return; }
  const r = await fetch(`api/tasks/${encodeURIComponent(openId)}/act`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, comment, key }) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { err.hidden = false; err.textContent = body.error || `Failed (${r.status})`; return; }
  state.tasks = state.tasks.map((t) => (t.id === body.id ? body : t));
  $("f-comment").value = "";
  render(); renderDialog(true);
  clearTimeout(poll); poll = setTimeout(refresh, 3000);
}

$("lanes").addEventListener("keydown", (e) => {

});
$("lanes").addEventListener("click", (e) => {

  openId = c.dataset.id; renderDialog(true); $("dlg").showModal();
});
// Drag a card to another lane to change its status (desktop only; HTML5 drag events don't fire on touch).
const LANE_STATUS = { todo: "todo", doing: "doing", waiting: "waiting", closed: "done" };
$("lanes").addEventListener("dragstart", (e) => { const c = e.target.closest(".card"); if (c) e.dataTransfer.setData("text/plain", c.dataset.id); });
$("lanes").addEventListener("dragover", (e) => { const l = e.target.closest(".lane"); if (!l) return; e.preventDefault(); l.classList.add("drop"); });
$("lanes").addEventListener("dragleave", (e) => { const l = e.target.closest(".lane"); if (l && !l.contains(e.relatedTarget)) l.classList.remove("drop"); });
$("lanes").addEventListener("drop", async (e) => {
  const l = e.target.closest(".lane"); if (!l) return;
  e.preventDefault(); l.classList.remove("drop");
  const t = state.tasks.find((x) => x.id === e.dataTransfer.getData("text/plain"));

  const r = await fetch(`api/tasks/${encodeURIComponent(t.id)}?actor=eugene`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: LANE_STATUS[l.dataset.lane] }) }).catch(() => null);
  if (!r || !r.ok) { $("note").hidden = false; $("note").textContent = `Couldn't move “${t.title}”.`; return; }
  apply(r);
});
$("dlg").addEventListener("click", (e) => {
  if (e.target === $("dlg") || e.target.id === "x") return $("dlg").close();
  const u = e.target.closest("[data-untag]");

// Tags are typed or picked from the ones in use; "#Some Tag" is stored as some-tag.

$("dlg").addEventListener("close", () => { openId = null; });
// Moving a task to another area also moves where its next session runs.
$("dlg").addEventListener("change", async (e) => {

$("run-brief").addEventListener("click", async () => {

// The open tab lives in the URL hash, so a reload or a bookmark keeps it.
function showTab() {

  $("tab-tickets").setAttribute("aria-selected", !hist); $("tab-history").setAttribute("aria-selected", hist);
  $("lanes").hidden = hist; $("toolbar").hidden = hist; $("log").hidden = !hist;

// History reads one Monday–Sunday week at a time from the server's week files, newest first, grouped by day.
const mondayOf = (d) => { const m = new Date(d); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return ymd(m); };
const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return ymd(d); };
let week = mondayOf(new Date());
async function loadLog() {
  const shown = week;
  const r = await fetch(`api/log?week=${shown}`).catch(() => null);
  if (!r || !r.ok || shown !== week) return;
  const { entries: all, older } = await r.json();
  // A task's line carries its area when written (older lines take the task's current one), and the task's current group and tags;
  // board-level lines (brief, sweep, triage runs) belong to no one area, so they show only while nothing is filtered out.
  const tasks = new Map(state.tasks.map((t) => [t.id, t]));
  for (const e of all) if (e.task && !e.area) e.area = (tasks.get(e.task) || {}).area;
  const entries = all.filter((e) => e.task ? visible({ ...tasks.get(e.task), area: e.area }) : !filtering());
  const thisWeek = mondayOf(new Date());
  $("wk-label").textContent = `${dm(week)} – ${dm(addDays(week, 6))}${week === thisWeek ? " · this week" : ""}`;
  $("wk-prev").disabled = !older; $("wk-next").disabled = week >= thisWeek;
  let day = "";
  $("activity").innerHTML = entries.sort((a, b) => b.at.localeCompare(a.at)).map((e) => {
    const d = ymd(new Date(e.at)), head = d === day ? "" : `<li class="day">${d === today ? "Today" : new Date(e.at).toLocaleDateString("en-GB", { weekday: "long" })} ${dm(d)}</li>`;
    day = d;
    return head + `<li><time title="${esc(e.at)}">${hm(e.at)}</time><span><span class="who">${esc(e.actor)} · ${esc(e.kind)}</span> — ${esc(e.title || "board")}${e.area && e.area !== "work" ? ` <span class="pill">${esc(areaName(e.area))}</span>` : ""}<br><span class="txt">${linkify(e.text.length > 280 ? e.text.slice(0, 280) + "…" : e.text)}</span></span></li>`;
  }).join("") || `<li><time>—</time><span class="hint">Nothing this week.</span></li>`;
}
$("wk-prev").addEventListener("click", () => { week = addDays(week, -7); loadLog(); });
$("wk-next").addEventListener("click", () => { week = addDays(week, 7); loadLog(); });
$("tab-tickets").addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); showTab(); });
$("tab-history").addEventListener("click", () => { history.replaceState(null, "", "#history"); showTab(); });
showTab();
refresh();
</script>
</body>
